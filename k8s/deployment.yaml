apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ci-showcase
  labels:
    app: devops-ci-showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ci-showcase
  template:
    metadata:
      labels:
        app: devops-ci-showcase
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/billnyarko/devops-ci-showcase:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_VERSION
              value: "0.1.0"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
